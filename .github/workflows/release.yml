name: Multi-Platform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Arch Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3/M4)
          - goos: darwin
            goarch: arm64
            output_name: cybercompanion-darwin-arm64
          # macOS Intel
          - goos: darwin
            goarch: amd64
            output_name: cybercompanion-darwin-amd64
          # Pocket WiFi U20 / Android / Raspberry Pi 4/5 (64-bit ARM)
          - goos: linux
            goarch: arm64
            output_name: cybercompanion-linux-arm64
          # Pocket WiFi Qualcomm 410/210 (32-bit ARMv7)
          - goos: linux
            goarch: arm
            goarm: 7
            output_name: cybercompanion-linux-armv7
          # Generic Linux Server / Docker / Soft Router (x86_64)
          - goos: linux
            goarch: amd64
            output_name: cybercompanion-linux-amd64
          # Windows PC (64-bit)
          - goos: windows
            goarch: amd64
            output_name: cybercompanion-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Compile CyberCompanion
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          # 版本号取自 tag（v1.1.0 这种）；workflow_dispatch 手动触发时退化为短 SHA。
          # 之前这里只传了 -s -w，没有 -X main.version，
          # 导致发行版二进制里 version 恒为空，-version 也无法输出。
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-${GITHUB_SHA::8}"
          fi
          echo "构建版本: $VERSION"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::8} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o build/${{ matrix.output_name }} ./cmd/cybercompanion
          # 冒烟测试：确认版本号真的被注入进去了
          if [[ "${{ matrix.goos }}" == "linux" && "${{ matrix.goarch }}" == "amd64" ]]; then
            ./build/${{ matrix.output_name }} -version
            ./build/${{ matrix.output_name }} -V | grep -q "$VERSION" || {
              echo "::error::版本号注入失败，期望包含 $VERSION"
              exit 1
            }
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: build/${{ matrix.output_name }}

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compile Native Go Core for Android (arm64, armv7 & x86_64)
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -buildmode=pie -ldflags="-s -w" -o android/app/src/main/jniLibs/arm64-v8a/libcybercompanion.so ./cmd/cybercompanion
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o android/app/src/main/jniLibs/armeabi-v7a/libcybercompanion.so ./cmd/cybercompanion
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildmode=pie -ldflags="-s -w" -o android/app/src/main/jniLibs/x86_64/libcybercompanion.so ./cmd/cybercompanion

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p build/
          # APK 名跟随 tag，不再硬编码 v1.0.0
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-${GITHUB_SHA::8}"
          fi
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} "build/CyberCompanion-Android-${VERSION}.apk" \;
          ls -lh build/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberCompanion-Android.apk
          path: build/CyberCompanion-Android-*.apk

  release:
    name: Create GitHub Release
    needs: [build, build-apk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package Release Assets
        run: |
          mkdir -p dist
          find release-artifacts -type f -exec mv {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
